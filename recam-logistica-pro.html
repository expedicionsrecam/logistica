<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Recam Logística Pro</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style data-app>
:root{color-scheme:dark;
  --ink:#15181E; --ink2:#3A3F4A; --muted:#5E626B; --line:#DEDED8; --line2:#C9CBD1;
  --bg:#F4F4F1; --surface:#FFFFFF; --soft:#FAFAF8; --yellow:#F2C200; --corr:#FBEFC2; --corrText:#6B5600;
  --navy:#15181E; --red:#B42318;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark!important}
button,input,select,textarea{color:var(--tx)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

header{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--ink)}
.hwrap{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo .li{width:30px;height:30px;display:block}
.logo .lw{height:16px;width:auto;display:block}
.logo small{color:#B8BCC6;font-size:13px;border-left:1px solid #3A3F4A;padding-left:10px}
nav{display:flex;flex-wrap:wrap;gap:2px;min-width:0;max-width:100%}
nav button{background:none;border:0;color:#D5D8DE;padding:0 12px;min-height:52px;font-size:14px;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button[aria-current="page"]{color:#fff;font-weight:600;border-bottom-color:var(--yellow)}
.hright{margin-left:auto;font-size:12px;color:#B8BCC6;display:flex;gap:12px;align-items:center}
.hright button{background:none;border:1px solid #3A3F4A;color:#D5D8DE;border-radius:6px;padding:6px 10px;font-size:12px}
.ctx{background:#262A33;color:#fff}
.ctx .in{max-width:1440px;margin:0 auto;padding:8px 24px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.ctx label{color:#C9CCD3}
.ctx select{min-height:40px;border-radius:6px;border:1px solid #4A505C;background:#15181E;color:#fff;padding:0 10px;max-width:100%}
.ctx button{background:none;border:0;color:var(--yellow);text-decoration:underline;text-underline-offset:3px;padding:6px 4px}

main{max-width:1440px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:28px}
h2{margin:0;font-size:17px}
h3{margin:0;font-size:15px}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.titlebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.btn{min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line2);background:var(--sf);color:var(--tx);font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--ink2)}
.btn-pri{background:var(--yellow);border-color:var(--yellow);font-weight:600}
.btn-pri:hover{border-color:var(--ink)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn-danger{color:var(--red);border-color:#E3B4AF}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input,select.input{min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--sf);min-width:0}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f .input,div.f .input{font-weight:400;font-size:15px}
.hint{font-size:12px;color:var(--muted);font-weight:400}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--mono)}
.kpi .s{font-size:13px;color:var(--muted);margin-left:6px}

.st-libre{background:var(--sf);color:var(--muted);border:1px solid #B5B7BD}
.st-parcial{background:#C9D7EE;color:var(--tx);border:1px solid #8AA5CF}
.st-ocupada{background:var(--navy);color:#fff;border:1px solid var(--navy)}
.st-reservada{background:#F0A050;color:var(--tx);border:1px solid #C9741F}
.st-bloqueada{background:repeating-linear-gradient(135deg,#B42318 0 6px,#8F1C13 6px 12px);color:#fff;border:1px solid #8F1C13}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--tx2);align-items:center}
.legend i{display:inline-block;width:18px;height:13px;border-radius:3px;vertical-align:middle;margin-right:6px}

.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split>.a{flex:999 1 640px;min-width:0}
.split>.b{flex:1 1 470px;min-width:0;display:flex;flex-direction:column;gap:18px}
.planwrap{overflow-x:auto}
.plan{position:relative;margin:0 auto;background:var(--soft);border:2px solid var(--ink2);border-radius:4px}
.plan .z{position:absolute;display:flex;align-items:center;font-size:11px}
.plan .corr{background:var(--corr);color:var(--corrText);padding-left:10px}
.plan .rl{position:absolute;font-size:11px;font-weight:700;text-align:center}
.plan .face{position:absolute;border:1px solid var(--ink2);border-radius:2px;padding:0;font-size:10px;font-weight:600;font-family:var(--mono);display:flex;align-items:center;justify-content:center;overflow:hidden}
.plan .face.v{writing-mode:vertical-rl}
.plan .face.sel,.plan .spot.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);z-index:2}
.plan .face.hit,.plan .spot.hit{box-shadow:0 0 0 3px var(--yellow);z-index:1}
.plan .face.floorz{border:2px dashed var(--ink2);flex-direction:column;gap:3px;letter-spacing:.06em}
.plan .face.floorz small{font-size:9px;font-weight:500;letter-spacing:0}
.plan .spot{position:absolute;width:28px;height:28px;padding:0;font-size:11px;font-weight:600;border-radius:3px}
.elev{display:flex;flex-direction:column;gap:4px;margin-top:14px;overflow-x:auto}
.elev .r{display:grid;gap:4px;min-width:min-content}
.elev .lab{display:flex;align-items:center;font-size:11px;color:var(--muted);font-family:var(--mono)}
.elev .hd{text-align:center;font-size:11px;color:var(--muted);font-family:var(--mono)}
.cell{min-height:58px;padding:4px 2px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;overflow:hidden}
.cell b{font-family:var(--mono);font-size:12px}
.cell span{font-size:10px;line-height:1.2}
.cell.sel{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--yellow)}
.cell.hit{outline:2px dashed var(--yellow);outline-offset:-5px}
.floorbar{height:6px;background:var(--ink2);border-radius:2px;margin-left:44px}
.navbtn{width:44px;height:44px;border:1px solid var(--line2);background:var(--sf);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
dl.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:16px 0 0}
dl.grid dt{font-size:12px;color:var(--muted)}
dl.grid dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.hist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.hist li{padding:4px 0;color:var(--tx2)}
.hist ul{list-style:none;margin:6px 0 0;padding:0}

.tablebox{background:var(--sf);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--bg);text-align:left;font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;padding:12px 10px;white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid #ECECE8;vertical-align:middle}
tbody tr.on{background:#FFFBEA}
td.num,th.num{text-align:right;font-family:var(--mono)}
.old{color:var(--red);font-weight:700}
.link{background:none;border:0;padding:0;font-family:var(--mono);font-weight:600;color:var(--navy);text-decoration:underline;text-underline-offset:3px;text-align:left}
.bulk{background:#FFF7D6;border:1px solid #E8D27A;border-radius:8px;padding:10px 14px}
.pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--tx2)}
.bar{display:inline-block;width:110px;height:8px;background:#F6F1DC;border-radius:4px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:8px;background:var(--navy)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--ink)}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.sug{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sf)}
.sug.best{background:var(--ink);color:#fff;border-color:var(--ink)}
.sug.best .muted{color:#C9CCD3}
.sug .code{font-family:var(--mono);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.sug ul{margin:0;padding-left:18px;font-size:13px}
.ok{background:#E6F2EA;border:1px solid #9CC9AA;color:#14532D;border-radius:8px;padding:12px 14px}
.err{background:#FCEBEA;border:1px solid #E3B4AF;color:#7A1A12;border-radius:8px;padding:12px 14px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:8px;background:var(--sf)}

/* naves */
.naves{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
@media (max-width:520px){.naves{grid-template-columns:1fr}}
.nave{background:var(--sf);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.nave .nh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nave .code{display:inline-block;background:var(--ink);color:var(--yellow);font-family:var(--mono);font-weight:600;font-size:12px;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.nave .nb{padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.alm{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.alm.cur{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--yellow)}
.alm .racks{display:flex;flex-wrap:wrap;gap:4px}
.alm .racks span{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px}
.alm .racks button{border:0;background:none;padding:0 2px;color:var(--red);font-size:14px;line-height:1}
.nave .nf{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}

/* PDA */
.pdawrap{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;justify-content:center}
.pda{width:380px;max-width:100%;height:760px;background:#2A2D33;border-radius:34px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pda .scr{height:100%;background:var(--bg);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.pda .top{background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:64px}
.pda .top .t{font-weight:700;font-size:17px}
.pda .top .s{font-size:12px;color:#B8BCC6}
.pda .back{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
.pda .body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.pda .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pda .menu button{min-height:112px;border-radius:12px;border:1px solid var(--line2);background:var(--sf);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pda .menu button.y{background:var(--yellow);border-color:var(--yellow)}
.pda .menu button svg{width:30px;height:30px}
.pda .scan{display:flex;gap:6px}
.pda .scan input{flex:1;min-width:0;min-height:52px;font-family:var(--mono);font-size:16px;border:2px solid var(--navy);border-radius:8px;padding:0 10px;text-transform:uppercase}
.pda .scan button{min-width:60px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-weight:700}
.pda .big{background:var(--ink);color:#fff;border-radius:12px;padding:14px}
.pda .big .k{font-size:12px;color:var(--yellow);font-weight:700;letter-spacing:.05em}
.pda .big .code{font-family:var(--mono);font-size:26px;font-weight:600;overflow-wrap:anywhere}
.pda .tap{display:flex;flex-wrap:wrap;gap:6px}
.pda .tap button{font-family:var(--mono);font-size:12px;border:1px dashed var(--line2);background:var(--sf);border-radius:6px;padding:6px 8px}
.pda .item{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pda .item.done{opacity:.55;text-decoration:line-through}
.pda .foot{padding:10px 14px 16px;background:var(--sf);border-top:1px solid var(--line);display:flex;gap:8px}
.pda .foot .btn{flex:1;min-height:52px;justify-content:center}
.pda select.input{width:100%}
.pdanotes{max-width:440px}
.pda .camalt{display:block;text-align:center;font-size:13px;color:var(--navy);text-decoration:underline;text-underline-offset:3px;padding:6px;cursor:pointer}
.pda .pdopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--sf);cursor:pointer}
.pda .pdopt input{margin-top:3px}
.pda .pdopt small{color:var(--muted);font-size:13px}
.touchpda{display:none}
@media (pointer: coarse){ input,select,textarea{font-size:16px!important} .touchpda{display:flex} }
@media (max-width: 760px){
  nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}
  nav button{white-space:nowrap;min-height:46px}
  .hwrap{gap:4px 12px}
  .hright{margin-left:0;width:100%;justify-content:space-between;padding-bottom:6px}
  .ctx .in{padding-top:6px;padding-bottom:6px}
  .ctx .in > span{display:none}
  .pdawrap{gap:16px}
  .pda{height:min(760px,calc(100dvh - 40px));padding:8px;border-radius:24px}
  .pda .scr{border-radius:18px}
}
.pdacol{display:flex;flex-direction:column;align-items:center}
.pdaside{display:flex;flex-direction:column;gap:18px;max-width:440px;min-width:0}
.pda .cambtn{width:100%;justify-content:center;min-height:60px;font-size:17px;position:relative}
.pda .pdop{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-weight:600;max-width:40%;overflow:hidden}
.pda .pdop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pda .pdop small{font-size:11px;color:#B8BCC6;font-weight:400}
body.pdafull .touchpda,body.pdafull header,body.pdafull .devfoot,body.pdafull .chatfab,body.pdafull .chatp,body.pdafull .pdaside,body.pdafull main>.titlebar{display:none!important}
body.pdafull main{padding:0;max-width:none;gap:0}
body.pdafull .pdawrap{display:block}
body.pdafull .pdacol{display:block}
body.pdafull .pda{width:100%;max-width:none;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
body.pdafull .pda .scr{border-radius:0}
body.pdafull .pda .top{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.pdanotes li{margin-bottom:8px}

dialog{background:var(--surface);color:var(--tx);color-scheme:dark;border:0;border-radius:10px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(21,24,30,.45)}
.z.dock{background:var(--ink);color:var(--yellow);border:2px solid var(--yellow);border-radius:6px;justify-content:center;gap:6px;font-size:13px;letter-spacing:.06em;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.calwrap{position:relative}
.calbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;font:inherit}
.cal{position:absolute;z-index:40;top:100%;left:0;margin-top:4px;width:248px;background:#2B2B2B;color:#fff;border-radius:6px;padding:10px 10px 8px;box-shadow:0 10px 28px rgba(0,0,0,.35);font-weight:400}
.cal button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;border-radius:3px}
.calhd{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.calhd .calt{flex:1;text-align:left;font-weight:700;font-size:14px;padding:4px 6px}
.calhd .calar{width:32px;height:32px;font-size:20px;color:#ddd}
.cal button:hover{background:#444}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg b{font-size:12px;padding:4px 0}
.calg button{height:30px;font-size:13px}
.calg button.out{color:#8a8a8a}
.calg button.hoy{outline:2px solid #fff;outline-offset:-2px}
.calg button.on{background:#7a7a7a;font-weight:700}
.calms{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.calms button{height:40px;text-transform:capitalize;font-size:13px}
.calms button.on{background:#7a7a7a;font-weight:700}
.calft{display:flex;justify-content:space-between;margin-top:8px}
.calft button{color:#8AB4F8;font-size:13px;padding:6px 8px}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dlg .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.dlg .g2,.dlg .g3{grid-template-columns:1fr}}
.devfoot{max-width:1440px;margin:0 auto;padding:0 24px 28px;text-align:left}
.devlink{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:2px;padding:6px}
nav button.devhid{border:1px dashed #6B7280;opacity:.75}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

.fcgrid{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.fcrow{display:grid;grid-template-columns:110px repeat(2,minmax(0,1fr));gap:8px;align-items:end}
/* días parado */
.cell.ag1,.spot.ag1{background:#FFD43B;color:#15181E;border:1px solid #C9A100}
.cell.ag2,.spot.ag2{background:#F28C28;color:#15181E;border:1px solid #B5651D}
.cell.ag3,.spot.ag3{background:#C92A2A;color:#fff;border:1px solid #8F1C13}
.cell.agnone,.spot.agnone{background:#F4F4F1;color:#8A8F99;border:1px dashed #C9CBD1}
.legend i.ag1,.agsum .ag1{background:#FFD43B}.legend i.ag2,.agsum .ag2{background:#F28C28}.legend i.ag3,.agsum .ag3{background:#C92A2A;color:#fff}
.agchip{display:inline-block;min-width:34px;padding:2px 8px;border-radius:999px;font-weight:700;font-family:var(--mono);font-size:13px;text-align:center}
.agchip.ag1{background:#FFD43B;color:#15181E}.agchip.ag2{background:#F28C28;color:#15181E}.agchip.ag3{background:#C92A2A;color:#fff}
.agsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.agsum span{padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;color:#15181E}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}

.pkhd,.pkmap,.pkchips,.pkgrid,.pkconf,.pkbox .legend,.pda .legend{flex-shrink:0}

.clihint{color:#14532D;font-weight:600}
.btn > svg:not([width]){width:18px;height:18px;flex:none}

/* cámara en vivo */
.camlbl,.camalt{position:relative;overflow:hidden}

.camov.nolive .camview{display:none}.camov.nolive .cambar{display:none}.camov.nolive .cammsg{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:17px}

/* clientes */
.clisug{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--sf);border:1px solid var(--line2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:35;max-height:290px;overflow:auto;font-weight:400}

.chip.os-parcial{background:#FDE6CC;color:#6B3A00;border:1px solid #F0A050}
.chip.os-completo{background:#DCF2E3;color:#14532D;border:1px solid #8CCBA0}

/* agrupar material */
.chip.rel3{background:#FFF1B8;color:var(--tx);border:1px solid #E8B800}
.chip.rel2{background:#DCE6F5;color:var(--tx);border:1px solid #8AA5CF}
.chip.rel1{background:#EFEFEB;color:var(--tx2);border:1px solid #C9CBD1}
.relbox{border-color:#E8D27A;background:#FFFCEF}
.pda .item.relpda{background:#FFF7D6;border-color:#E8B800}

.bultos .bl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}
/* zonas del plano (mapa y editor) */
.plan .zn,.ped .zn{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.15;overflow:hidden;padding:2px 4px}
.zn.vt span{writing-mode:vertical-rl}
.zn.t-pasillo{background:var(--corr);color:var(--corrText)}
.zn.t-mesa{background:#ECECE8;border:1px dashed #B5B7BD;color:var(--muted)}
.zn.t-oficina{background:#E6E9EF;border:1px solid #B5B7BD;color:var(--tx2)}
.zn.t-muelle{background:var(--ink);color:var(--yellow);border:2px solid var(--yellow);border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.04em}
.zn.t-suelo{background:var(--sf);border:2px dashed var(--ink2);color:var(--tx2);font-weight:600}
.zn.t-pared{background:var(--ink2);color:#fff}
.zn.t-zona{background:var(--sf);border:1px dashed var(--ink2);color:var(--tx2)}
/* editor del plano */
.ped{position:relative;margin:0 auto;border:2px solid var(--ink2);border-radius:4px;background-color:var(--soft);background-image:linear-gradient(rgba(21,24,30,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(21,24,30,.07) 1px,transparent 1px);background-size:20px 20px;user-select:none;-webkit-user-select:none}
.ped .pi{position:absolute;cursor:grab;touch-action:none}
.ped .pi:active{cursor:grabbing}
.ped .pi.on{outline:3px solid var(--yellow);outline-offset:2px;z-index:5}
.ped .rk{display:flex;gap:4px;z-index:2}
.ped .rk.h{flex-direction:column}
.ped .rk .fc{flex:1;min-width:0;min-height:0;background:#F6F1DC;border:1px solid var(--ink2);border-radius:2px;font:600 10px var(--mono);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--tx)}
.ped .rk.v .fc{writing-mode:vertical-rl}
.ped .rh{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--yellow);border:2px solid var(--ink);border-radius:3px;cursor:nwse-resize;touch-action:none;writing-mode:horizontal-tb}
.ped .rk.v .rh{cursor:ns-resize}.ped .rk.h .rh{cursor:ew-resize}

.pepanel{display:flex;flex-direction:column;gap:12px}
.pepanel .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.peadd{display:flex;flex-wrap:wrap;gap:8px}
.zsw{display:inline-block;width:16px;height:12px;border-radius:2px;flex:none}

/* multidispositivo: zonas seguras del móvil y aviso de sincronización */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
.syncbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.4;align-items:center;justify-content:center;gap:10px;text-align:center;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.syncbar.wait{display:flex;background:var(--ink);color:#fff}

@media (prefers-reduced-motion:reduce){.syncbar .dot{animation:none}}

/* ============ tema claro (revisión general) ============ */

/* búsqueda por bulto: Pedido, PT, cliente o U-…; sin tildes ni signos; qc = cliente exacto elegido */
const _ck = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
function itemHit(x, q, qc, cat){ if (cat && catOf(x) !== cat) return false; if (qc) return _ck(x.client) === qc;
  const t = String(q || '').trim().toLowerCase(); if (t.length < 2) return !!cat;
  if ([x.of, x.ref, x.client, x.uid, catTxt(x)].join(' ').toLowerCase().includes(t)) return true;
  const k = _ck(t); return k.length >= 2 && (_ck(x.client).includes(k) || _ck([x.of, x.ref].join(' ')).includes(k)); }
/* clientes distintos entre los bultos encontrados (agrupa «STADLER…» con el mismo comienzo) */
function cliGroups(codes, q, qc, cat){ const g = {};
  codes.forEach(k => items(DB.cells[k]).forEach(x => { if (!itemHit(x, q, qc, cat)) return; const key = _ck(x.client) || '(sin cliente)';
    const o = g[key] || (g[key] = {key, name:x.client || 'Sin cliente', n:0, uds:0, locs:new Set(), peds:new Set()}); o.n++; o.uds += +x.qty || 0; o.locs.add(k); if (x.of) o.peds.add(x.of); }));
  return Object.values(g).sort((a, b) => a.name.localeCompare(b.name, 'es')); }
function cliChips(groups, act, cur){ if (cur) { const g = groups.find(x => x.key === cur); return '<div class="row" style="gap:8px"><span class="muted" style="font-size:13px">Cliente:</span><b>' + esc(g ? g.name : cur) + '</b><button class="btn btn-sm" data-a="' + act + '" data-k="">✕ Ver todos los clientes</button></div>'; }
  if (groups.length < 2) return '';
  return '<div style="display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:13px">Hay ' + groups.length + ' clientes con esa búsqueda: elige uno para ver solo el suyo</span><div class="row" style="gap:8px">'
    + groups.map(g => '<button class="btn btn-sm" data-a="' + act + '" data-k="' + esc(g.key) + '"><b>' + esc(g.name) + '</b><span class="muted"> · ' + g.n + (g.n === 1 ? ' bulto' : ' bultos') + ' · ' + g.locs.size + (g.locs.size === 1 ? ' ubic.' : ' ubic.') + ' · ' + g.uds + ' uds</span></button>').join('') + '</div></div>'; }
/* filtro por tipo de material: funciona sin escribir pedido ni PT */
function catBar(act, cur){ const n = {}; IDX.all.forEach(k => items(DB.cells[k]).forEach(x => { const c = catOf(x); if (c) n[c] = (n[c] || 0) + 1; }));
  return '<div class="row catbar" role="group" aria-label="Filtrar por tipo de material"><span class="muted" style="font-size:13px">Tipo de material:</span><button class="btn btn-sm' + (cur ? '' : ' on') + '" data-a="' + act + '" data-k="" aria-pressed="' + !cur + '">Todos</button>'
    + Object.keys(CATS).map(k => '<button class="btn btn-sm cat-' + k + (cur === k ? ' on' : '') + '" data-a="' + act + '" data-k="' + k + '" aria-pressed="' + (cur === k) + '">' + CATS[k].t + ' <b>' + (n[k] || 0) + '</b></button>').join('') + '</div>'; }
/* líneas de salida: un bulto por línea (una ubicación agrupada puede dar varias) */
function pickLines(q, almId, qc, cat){ q = String(q || '').trim().toLowerCase(); if (q.length < 2 && !qc && !cat) return []; const out = [];
  routeSort((almId ? almCodes(almId) : IDX.all).filter(k => hasGoods(DB.cells[k]) && items(DB.cells[k]).some(x => itemHit(x, q, qc, cat)))).forEach(k => items(DB.cells[k]).forEach(x => { if (itemHit(x, q, qc, cat)) out.push({key:k + '|' + x.uid, code:k, it:x}); }));
  return out; }
function vSal(){

    if (!z && !ped) { P.msg = ['err', 'Escanea la etiqueta de la pieza o escribe el número de pedido.']; return; }
    const list = []; routeSort(IDX.all.filter(k => ['ocupada','parcial'].includes(DB.cells[k].state))).forEach(k => items(DB.cells[k]).forEach(x => { if (z ? x.of === z.code : String(x.of || '').startsWith(ped + '_')) list.push(k + '|' + x.uid); }));
    if (!list.length) { P.msg = ['err','No hay material de ' + esc(raw) + ' en ningún almacén.']; return; }
    P.d = {of:z ? z.code : ped, list, done:[]}; P.step = 1;
  } else if (P.mode === 'recoger') {
    const v = resolve(raw), hits = v ? P.d.list.filter(x => x.split('|')[0] === v && (!/^U-/.test(raw) || x.split('|')[1] === raw)) : [];
    if (!hits.length) { P.msg = ['err', esc(raw) + ' no es de este pedido. Revisa la ubicación.']; return; }
    hits.forEach(x => { if (!P.d.done.includes(x)) P.d.done.push(x); }); P.msg = ['ok','Recogido ' + v + (hits.length > 1 ? ' (' + hits.length + ' bultos)' : '')];
  } else if (P.mode === 'mover' && P.step === 0) {
    let v = resolve(raw);
    if (!v && pz(raw)) { const ks = IDX.all.filter(k => items(DB.cells[k]).some(x => x.of === pz(raw).code));
      if (ks.length > 1) { P.msg = ['err', 'Este PT está en ' + ks.length + ' ubicaciones (' + ks.slice(0, 4).join(', ') + '). Escanea la ubicación de origen.']; return; }
      v = ks[0] || null; }
    if (!v || !['ocupada','parcial'].includes(DB.cells[v].state)) { P.msg = ['err','En ' + esc(raw) + ' no hay material para mover.']; return; }
    P.d = {from:v}; P.step = 1;
  } else if (P.mode === 'mover') {
    const v = resolve(raw);
    if (!v || DB.cells[v].state !== 'libre') { P.msg = ['err','El destino tiene que ser una ubicación libre.']; return; }
    move(P.d.from, v, pdaUser()); toast('Movido de ' + P.d.from + ' a ' + v); P.mode = 'menu'; P.step = 0; P.d = {};
  } else if (P.mode === 'consultar') {
    const pick = (k, f) => { const its = items(DB.cells[k]), it = its.find(f) || its[0]; P.d = {code:k, uid:it ? it.uid : null, adj:it ? it.qty || 0 : 0}; };
    const v = resolve(raw); if (v) { pick(v, x => x.uid === raw); return; }
    const z = pz(raw), list = routeSort(z ? IDX.all.filter(k => items(DB.cells[k]).some(x => x.of === z.code)) : findGoods(raw));
    if (z && list.length === 1) { pick(list[0], x => x.of === z.code); return; }
    P.d = {list, q:z ? pzTxt(z.code) : raw};
  }
}

/* pedido_PT del formulario; con un tipo especial el pedido y el PT son opcionales */
function eCode(f){ const cat = CATS[f.cat] ? f.cat : ''; let ped = (f.of || '').trim(), pt = (f.ref || '').trim();
  if (!cat && (!ped || !pt)) return {err:'Indica el pedido, el PT y la cantidad.'};
  if (!(+f.qty > 0)) return {err:cat ? 'Indica la cantidad.' : 'Indica el pedido, el PT y la cantidad.'};
  if (cat === 'bloq' && !(f.why || '').trim()) return {err:'Indica el motivo del bloqueo.'};
  const z = pzJoin(ped || CATS[cat].code, pt || NOREF); return z ? {z, ped, pt} : {err:'Pedido o PT no válidos. ' + PZ_ERR}; }
function doPlace(code){ const e = UI.e, f = e.f;
  const ec = eCode(f); if (ec.err) { e.msg = ['err', ec.err]; render(); return; } const z = ec.z;
  if (!M(code)) { e.msg = ['err','La ubicación ' + esc(code) + ' no existe.']; render(); return; }
  const c = DB.cells[code];
  if (!(c.state === 'libre' || canGroup(code, z.code))) { e.msg = ['err', code + (hasGoods(c) ? ' tiene material de otra CDA y otro PT. Para agrupar, elige una ubicación con la misma CDA o el mismo PT.' : ' está ' + ST[c.state].toLowerCase() + '.')]; render(); return; }
  const grouped = hasGoods(c), n = place(code, Object.assign({}, f, {of:z.code, ref:ec.pt ? z.prod : ''}));
  const lk = '<button class="link" data-a="goMap" data-code="' + code + '">' + code + '</button>';
  e.msg = ['ok','<b>' + esc(pzTxt(z.code)) + '</b>' + (CATS[f.cat] && ec.ped ? ' · ' + CATS[f.cat].t : '') + ' (' + esc(f.qty) + ' uds) ' + (grouped ? 'agrupado en ' + lk + ' (' + esc(whereText(code)) + '). La ubicación tiene ahora ' + (n > 1 ? n + ' bultos' : '1 bulto con ' + cellQty(DB.cells[code]) + ' uds') + '.' : 'ubicado en ' + lk + ' (' + esc(whereText(code)) + '). Imprime la etiqueta de contenido desde el mapa si la necesitas.')];
  e.f = {of:'', ref:'', client:'', qty:'', kg:'', ship:'', urg:false, cat:'', why:''}; e.sp = null; e.cal = null; e.sug = null; e.rel = null; e.pk = null; e.cliAuto = false; e.scan = ''; render(); }
function count(code, r){ const i = UI.i; (i.done[i.face] = i.done[i.face] || {})[code] = r; const c = DB.cells[code];
  addLog({type:'Recuento', code, uid:c.uid, of:c.of, qty:c.qty, note: r === 'OK' ? 'Correcto' : 'Discrepancia: revisar', user:curUser()}); render(); }

/* ================= plano editable (estanterías, mesas, pasillos, muelle…) ================= */
/* a.plan = {v, w, h, racks:{ID:{x, y, o:'v'|'h', len}}, zones:[{id, t, x, y, w, h, txt}]}
   Las posiciones del plano solo cambian el dibujo y las distancias: los códigos de ubicación no cambian. */
const PXM = 0.08; /* 1 px del plano ≈ 8 cm (igual que metres()) */
const ZT = {
  pasillo:{n:'Pasillo', w:240, h:30}, mesa:{n:'Mesas / zona de trabajo', w:160, h:80}, oficina:{n:'Oficina', w:120, h:80},
  muelle:{n:'Muelle de carga', w:100, h:40}, suelo:{n:'Palets en suelo', w:60, h:120}, pared:{n:'Pared / columna', w:160, h:10}, zona:{n:'Otra zona', w:120, h:80}
};
const PEd = {cur:null};
const pxm = p => Math.round(p * PXM * 10) / 10;
const mpx = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? Math.round(n / PXM) : null; };
const defLen = r => clamp(r.mods * 24, 48, 320);
const rackThick = r => (r.sides === 1 ? 1 : 2) * 24 - 4;
function zoneEl(z, mode, on){
  const vt = z.h > z.w * 1.6 && z.w < 90 ? ' vt' : '', txt = z.txt || ZT[z.t].n;
  const st = 'left:' + z.x + 'px;top:' + z.y + 'px;width:' + z.w + 'px;height:' + z.h + 'px';
  if (mode === 'ed') return '<div class="zn t-' + z.t + vt + ' pi' + (on ? ' on' : '') + '" data-k="z:' + z.id + '" tabindex="0" role="button" aria-label="' + esc(ZT[z.t].n + ': ' + txt) + '" style="' + st + '"><span>' + esc(z.t === 'pared' && !z.txt ? '' : txt) + '</span>' + (on ? '<span class="rh" aria-hidden="true"></span>' : '') + '</div>';
  return '<div class="zn t-' + z.t + vt + '" role="img" aria-label="' + esc(txt) + '" style="' + st + '"><span>' + esc(z.t === 'pared' && !z.txt ? '' : txt) + '</span></div>';
}
function layoutPlan(a){
  const P = a.plan, faces = [], labels = [], sidesOf = r => r.sides === 1 ? ['A'] : ['A','B'];

  const sz = a.floor ? P.zones.find(z => z.t === 'suelo') : null;
  P.zones.forEach(z => { if (z !== sz) deco += zoneEl(z, 'map'); });
  const mz = P.zones.find(z => z.t === 'muelle');
  if (mz) { dock = {x:mz.x + mz.w/2, y:mz.y + mz.h/2}; dockName = 'muelle'; } else dock = {x:w - 30, y:30};
  const extra = [];
  a.racks.forEach(r => { const p = P.racks[r.id]; if (!p) { extra.push(r); return; } const len = p.len || defLen(r);

async function erpPush(clear){

  try {
    if (clear || !DB.erp) { await db.doc('erp/meta').set({deleted:true, at:new Date().toISOString()}); SYNC.erpAt = null; }
    else { const E = DB.erp, parts = Math.max(1, Math.ceil(E.lines.length / ERP_CH));
      for (let i = 0; i < parts; i++) await db.doc('erp/p' + i).set({at:E.at, i, lines:E.lines.slice(i * ERP_CH, (i + 1) * ERP_CH)});
      await db.doc('erp/meta').set({file:E.file, at:E.at, user:E.user, map:E.map || {}, n:E.lines.length, parts}); SYNC.erpAt = E.at; }
    const q = await db.collection('erp').get(), keep = clear || !DB.erp ? 0 : Math.max(1, Math.ceil(DB.erp.lines.length / ERP_CH));
    for (const d of q.docs) { const m = /^p(\d+)$/.exec(d.id); if (m && +m[1] >= keep) await db.doc('erp/' + d.id).delete(); }
  } catch(err) { syncErr(err); } finally { SYNC.erpBusy = false; }
}
function erpApply(){
  const m = SYNC.erpSnap; if (!m || SYNC.erpBusy || !SYNC.on) return; const meta = m.meta;
  if (!meta) { if (DB.erp && !SYNC.ro) erpPush(); return; }
  if (meta.deleted) { if (DB.erp) { DB.erp = null; save(true); schedRender(); } return; }
  if (DB.erp && DB.erp.at === meta.at) return;
  const lines = []; for (let i = 0; i < meta.parts; i++) { const p = m['p' + i]; if (!p || p.at !== meta.at) return; lines.push(...(p.lines || [])); }
  DB.erp = {file:meta.file, at:meta.at, user:meta.user, map:meta.map || {}, lines:plain(lines)}; save(true); schedRender();
}
function erpSubscribe(db){
  db.collection('erp').onSnapshot(q => { if (q.metadata && q.metadata.fromCache && !q.docs.length) return; const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); SYNC.erpSnap = m; erpApply(); }, syncErr);
}

/* cruce pedidos del ERP ↔ material ubicado */
function erpTrack(){
  const E = DB.erp; if (!E) return null; const stock = {}, out = {}, t0 = isoOf(new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate());
  IDX.all.forEach(k => { const c = DB.cells[k]; items(c).forEach(x => { const s = stock[x.of] || (stock[x.of] = {q:0, r:0, locs:[], c:x.client}); if (c.state === 'reservada') s.r += +x.qty || 0; else s.q += +x.qty || 0; if (!s.locs.includes(k)) s.locs.push(k); }); });
  DB.log.forEach(l => { if (l.type === 'Salida' && l.of) out[l.of] = (out[l.of] || 0) + (+l.qty || 0); });
  const seen = new Set(), pm = new Map();
  const lines = E.lines.map(L => { const of = L.p + '_' + L.t, s = stock[of] || {q:0, r:0, locs:[]}, exp = Math.max(+L.s || 0, out[of] || 0); seen.add(of);
    const falta = Math.max(0, L.q - s.q - exp), st = exp >= L.q ? 'expedido' : s.q + exp >= L.q ? 'completo' : s.q + exp > 0 ? 'parcial' : 'sin';
    const late = !!L.f && L.f < t0 && (st === 'sin' || st === 'parcial');
    const o = Object.assign({}, L, {of, ub:s.q, res:s.r, exp, falta, st, late, sobra:Math.max(0, s.q + exp - L.q), locs:routeSort(s.locs)});
    const P = pm.get(L.p) || pm.set(L.p, {p:L.p, c:L.c || '', f:L.f || '', lines:[], q:0, falta:0}).get(L.p); P.lines.push(o); P.q += L.q; P.falta += falta; if (!P.c && L.c) P.c = L.c; if (L.f && (!P.f || L.f < P.f)) P.f = L.f;
    return o; });
  const peds = [...pm.values()].map(P => { const sts = P.lines.map(l => l.st);
    P.st = sts.every(s => s === 'expedido') ? 'expedido' : sts.every(s => s === 'expedido' || s === 'completo') ? 'completo' : sts.some(s => s !== 'sin') ? 'parcial' : 'sin';
    P.done = P.lines.filter(l => l.st === 'completo' || l.st === 'expedido').length; P.faltPT = P.lines.filter(l => l.falta > 0).length; P.late = P.lines.some(l => l.late); return P; })
    .sort((a, b) => (a.f || '9999') .localeCompare(b.f || '9999') || a.p.localeCompare(b.p));
  const orphan = Object.keys(stock).filter(of => !seen.has(of) && stock[of].q > 0).map(of => ({of, q:stock[of].q, c:stock[of].c || '', locs:routeSort(stock[of].locs)})).sort((a, b) => a.of.localeCompare(b.of));
  return {lines, peds, orphan};
}

/* nombre leído (con posibles errores) → cliente de la lista */

  }, syncErr);
  db.collection('cells').onSnapshot(q => { const m = {}; q.docs.forEach(d => { m[d.id] = JSON.stringify(d.data()); }); SYNC.remoteCells = m; if (!q.metadata || !q.metadata.fromCache) SYNC.cellsReady = true;

async function initSync(){

  startSync(db);
}
async function resetRemote(){

}

/* lee un QR de una foto hecha con la cámara */
async function decodeQR(file){
  if (typeof jsQR !== 'function') return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = img.naturalWidth, H = img.naturalHeight;
    /* [fracción del centro que se recorta, tamaño máximo]: primero la foto entera, luego zonas centrales ampliadas */
    for (const [fr, max] of [[1, 1280], [1, 800], [.6, 1200], [1, 2000], [.4, 1000], [.8, 1600], [.25, 800]]) {
      const cw = W * fr, ch = H * fr, sx = (W - cw) / 2, sy = (H - ch) / 2;
      const sc = Math.min(1, max / Math.max(cw, ch)), w = Math.max(1, Math.round(cw*sc)), h = Math.max(1, Math.round(ch*sc));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d', {willReadFrequently:true}); cx.drawImage(img, sx, sy, cw, ch, 0, 0, w, h);
      const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'attemptBoth'}); if (r && r.data) return r.data.trim();
    }
    return null;
  } catch(e) { return null; } finally { URL.revokeObjectURL(url); }
}

  P.input = txt; pdaScan(); pdaBuzz(!(P.msg && P.msg[0] === 'err')); render();
}
